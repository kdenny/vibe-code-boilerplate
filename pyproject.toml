[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe"
dynamic = ["version"]
description = "Local-first workflow automation toolkit for agent-managed development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.33.1",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Integration extras: bare `vibe` stays core-only; provider/runtime deps live here.
pr-autopilot = []
fly = [
    "tomli>=2.0.0",
]
batch = [
    "pyyaml>=6.0.3",
]

[project.scripts]
vibe = "vibe.cli.main:main"

[project.entry-points."vibe.integrations"]
pr-autopilot = "vibe.integrations.pr_autopilot:integration"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "mypy>=1.20.1",
    "ruff>=0.1.0",
    # Used by tests/test_coderabbit_config.py to validate .coderabbit.yaml against
    # the schema's maxLength limits (an over-limit field silently disables the config).
    "pyyaml>=6.0.3",
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["vibe*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
