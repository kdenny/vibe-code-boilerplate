# yaml-language-server: $schema=https://coderabbit.ai/schemas/coderabbit-config.json
#
# CodeRabbit configuration for the VIBE repo revamp.
# ---------------------------------------------------------------------------
# Goal: high-signal, decisive review (approve vs request-changes), low chatter.
# This file is the standing "review firewall" for the non-destructive revamp.
#
# SYNC RULE: Any substantial change to repo structure, module boundaries, the
# local run/validation flow, the testing strategy, or the agent-PR contract MUST
# be reflected here in the same PR. CLAUDE.md, this file, and the plan docs under
# docs/architecture/ (each paired with a Linear summary/project doc —
# VIBE-174-modular-restructure-plan.md and VIBE-140-cloud-coding-environment.md)
# are a matched set — if one moves, the others move. CodeRabbit should request
# changes on PRs that shift the architecture without updating them.
#
# SPEED RULE: This project is optimized for speed. If a reviewer or agent ever
# sees a way to make setup faster, validation faster, or the agent loop tighter,
# surface it in the review — even when the PR is otherwise approvable.
# ---------------------------------------------------------------------------

language: "en-US"

# Tone is the global voice for every comment. Keep it decisive and fast.
# NOTE: CodeRabbit caps tone_instructions at 250 chars; over that the WHOLE
# config silently falls back to defaults. Keep this terse and under the limit.
tone_instructions: >-
  Be decisive and concise: lead with an approve or request-changes verdict,
  then only what matters. Skip subjective style. Always flag architectural
  drift, weak tests, hidden coupling, broken local-run paths, and any way to
  make the agent loop faster.

early_access: false

reviews:
  # 'chill' keeps low-value style nitpicking down. Strictness is reintroduced
  # surgically via path_instructions and pre_merge_checks below, so signal stays
  # high without drowning the PR in style chatter.
  profile: "chill"

  # Decisive outcomes: CodeRabbit blocks the PR when it requests changes.
  request_changes_workflow: true
  abort_on_close: true

  high_level_summary: true
  high_level_summary_instructions: >-
    Summarize what changed and why in 3-5 bullets max. Call out any change to
    module boundaries, local run/validation flow, or the agent-PR contract.
  changed_files_summary: true
  review_status: true
  estimate_code_review_effort: true
  collapse_walkthrough: true

  # Repo context: tie reviews back to the Linear ticket and related work.
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false

  # Noise reducers.
  poem: false
  sequence_diagrams: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    # Incremental re-review on every push keeps the agent loop tight.
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
    ignore_title_keywords:
      - "wip"
      - "skip-review"

  # Hard gates. These are what make review decisive instead of advisory.
  pre_merge_checks:
    title:
      mode: "error"
      # Every PR must reference its ticket, e.g. "VIBE-123: ...".
      requirements: >-
        The title must start with a ticket reference in the form VIBE-<number>
        followed by a colon and an imperative summary.
    description:
      # The built-in description check only takes `mode` (no `requirements`
      # field — that key would be silently ignored). The agent-PR contract is
      # enforced via the custom_checks entry below instead.
      mode: "error"
    issue_assessment:
      mode: "warning"
    # Custom checks are the schema-supported way to enforce arbitrary,
    # deterministic description requirements. This encodes the agent-PR contract.
    custom_checks:
      - name: "Agent-PR contract"
        mode: "error"
        instructions: >-
          The description must state: (1) what changed and why, (2) the staged,
          non-destructive migration step this represents, (3) test proof with the
          exact local commands run and their results, and (4) confirmation that
          affected modules remain independently runnable. For CLI changes, it must
          include the per-subcommand smoke-test matrix. Request changes if any of
          these four sections is missing.
      - name: "PR base branch"
        mode: "error"
        instructions: >-
          PRs must target the main branch. If this PR's base is a feature branch
          (it is bundled on top of another not-yet-merged PR's work), request
          changes UNLESS the PR is a draft, carries the DNM label, and BOTH its
          description AND the linked ticket clearly state which earlier ticket/PR it
          depends on and that it must wait for that PR to merge first. A PR based on
          a feature branch is never a valid final, mergeable state — once the parent
          merges it must be rebased onto main and retargeted.

  # Exclude generated, vendored, and archived material from review.
  path_filters:
    - "!**/*.lock"
    - "!**/.venv/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!docs/archive/**"

  # Path-specific review guidance. This is where architectural strictness lives.
  path_instructions:
    - path: "lib/vibe/**"
      instructions: >-
        Core Python package. Enforce clear module seams and explicit interfaces
        over hidden coupling. Flag: cross-module reach-through, new global state,
        functions that can only run inside the full app rather than in isolation,
        and structural churn not justified by the modular target architecture in
        CLAUDE.md. Require that behavior is preserved (non-destructive) and that
        the change is a staged extraction, not a big-bang rewrite.
    - path: "bin/**"
      instructions: >-
        CLI wrappers. Confirm the PR description documents a per-subcommand
        live smoke-test matrix (pass/fail/deferred) for every command of the
        modified CLI. Flag thin wrappers without docs, silently swallowed errors,
        and missing inline --help. Do not approve CLI changes whose only test
        proof is a mocked CI test.
    - path: ".envrc"
      instructions: >-
        Committed direnv config and part of the local run/validation flow. It
        MUST stay secret-free (machine-specific secrets belong in .env.local /
        .envrc.local, both gitignored) and must degrade gracefully when direnv
        is absent. Any change to how local env loads, the venv activates, or
        bin/ reaches PATH is a local-setup-flow change — confirm CLAUDE.md and
        this file stay consistent per the sync rule.
    - path: "tests/**"
      instructions: >-
        Require tests at the right level per recipes/testing/modular-testing.md:
        one module = one unit test file (lib/vibe/<name>.py -> tests/test_<name>.py;
        lib/vibe/<pkg>/ -> tests/test_<pkg>_*.py), module-level unit tests for
        isolated changes, and combinatorial/integration tests (under
        tests/integration/) only where modules are intentionally designed to
        compose. Flag behavior that ships without a corresponding test, tests that
        pin private internals, and tests that mock so much they no longer exercise
        the real path. Prefer parametrization over copy-pasted near-identical
        cases. When a module is rewritten, its tests should be re-leveled in the
        same PR, not gutted in a separate one.
    - path: "tests/integration/**"
      instructions: >-
        Integration suites for REAL compose seams (>=2 modules designed to work
        together). The defining rule: mock ONLY the true I/O boundary
        (network/subprocess/filesystem) and run the real collaborating modules —
        never mock the collaborator itself (that's a unit test, and it proves the
        modules compose for real). Request changes if a suite here mocks a sibling
        lib/vibe module, exercises a seam the product doesn't actually have, or is
        not registered in INTEGRATION_SEAMS in lib/vibe/testscope.py. Flag any
        suite that needs live network/services — it doesn't belong here.
    - path: "lib/vibe/testscope.py"
      instructions: >-
        The module-scoped CI selector: maps changed files to pytest targets so
        PRs run only affected modules while main and shared-file changes run the
        full suite. Changing SOURCE_TEST_MAP, SHARED_PREFIXES, or INTEGRATION_SEAMS
        alters which tests gate a PR — require that test_testscope.py is updated
        alongside, that the change keeps the fail-safe (unmapped lib/vibe/ paths ->
        full suite), and that every INTEGRATION_SEAMS entry points at an existing
        suite with >=2 participants under lib/vibe/.
    - path: "pyproject.toml"
      instructions: >-
        The dependency source of truth, and part of the cacheable bootstrap
        contract (VIBE-185, recipes/environments/cloud-bootstrap.md). Any change
        to [project.dependencies] or [project.optional-dependencies] MUST be
        matched by a regenerated requirements.lock in the same PR
        (`uv pip compile pyproject.toml --extra dev --generate-hashes -o
        requirements.lock`) so the pinned/hashed install stays in sync and the
        dependency cache key (hash of requirements.lock) is valid. Flag a deps
        change that doesn't update the lock, and any new dependency that isn't
        clearly justified. pyproject is also in SHARED_PREFIXES — confirm the PR
        author expects it to trigger the full test suite.
    - path: ".github/workflows/**"
      instructions: >-
        CI must stay fast and local-first. CI is scoped per-module on PRs via
        lib/vibe/testscope.py (full suite on main and shared-file changes); flag
        any change that could let a PR skip tests for a module it actually
        touched. The Python install is the cached, locked uv path (sync from
        requirements.lock, cache keyed on its hash) with a pip fallback — keep
        both paths resolving to the same pinned versions; flag a change that
        breaks the cache key or drops the lock. Flag pinning/permission
        regressions, secrets in plaintext, and any attempt to make CLI tests in
        CI the primary verification (local live tests are the source of truth).
        Surface any opportunity to make CI faster.
    - path: "agent_instructions/**"
      instructions: >-
        Source of truth for agent instructions. If these change, confirm CLAUDE.md
        and this .coderabbit.yaml stay consistent with them.
    - path: "CLAUDE.md"
      instructions: >-
        The target-state revamp contract. Any change to module boundaries, the
        local run/validation flow, the testing strategy, or the agent-PR contract
        here MUST be matched by a corresponding update to .coderabbit.yaml in the
        same PR, and vice versa — CLAUDE.md and this file are the canonical matched
        pair (the Sync rule). Changes that touch the target structure, module
        boundaries, the staged migration sequence, or the validation contract MUST
        ADDITIONALLY update the plan doc
        (docs/architecture/VIBE-174-modular-restructure-plan.md); agent-PR-contract
        or review-policy changes that don't touch the plan's domain need not.
    - path: "docs/architecture/**"
      instructions: >-
        The architecture plan docs, each paired with a Linear summary/project doc
        (VIBE-174-modular-restructure-plan.md; VIBE-140-cloud-coding-environment.md
        — the cloud coding environment program). They are the source of truth for
        the target structure, the staged sequence, and the validation/agent-PR
        contract. If one changes, confirm CLAUDE.md, .coderabbit.yaml, and the
        paired Linear doc stay consistent, and that the staged sequence still
        reflects non-destructive, one-step-at-a-time migration. Flag drift between
        a plan and the live structure.
    - path: ".claude/commands/**"
      instructions: >-
        Agent skills/commands — part of the agent-PR contract surface.
        pr-autopilot.md defines how a cloud runner drives an opened PR to merge
        (wait for CodeRabbit + CI, fix CI/conflicts by rebase-on-main, work ahead
        on blockers as draft PRs to main, escalate to Slack, hold open <=90 min,
        de-attribute on the runner path only). If a command changes agent
        behavior, confirm it stays consistent with CLAUDE.md, the agent-ready
        rubric, and docs/architecture/VIBE-140-cloud-coding-environment.md. Flag
        any guidance to auto-merge, to target a non-main base for real (vs a draft
        to main), or to force-push anything other than a feature branch.
    - path: "recipes/**"
      instructions: >-
        Documentation recipes. Low risk; keep review light. Flag only broken
        instructions or guidance that contradicts the current revamp posture.
    - path: "docs/review/**"
      instructions: >-
        Review/scoping contracts. docs/review/board-context-brief.md is the
        substance layer above the rubric and triage model: the board's locked
        project truths, the recurring discipline-failure patterns, and the open
        contradictions an agent must inherit before pulling a ticket. It records
        what is true about the work and must not restate the rubric or the triage
        model. docs/review/agent-ready-rubric.md is the
        canonical definition of the agent-ready / needs-scoping / wall / gate
        labels and the dependency-hygiene rules.
        docs/review/triage-intelligence.md is the operating model on top of the
        rubric (taxonomy, the Linear Triage Intelligence guidance text, the safe
        auto-apply vs advisory boundary, and the board-quality -> CLAUDE.md
        feedback loop).
        docs/review/external-service-milestone-pattern.md is the canonical
        milestone + ticket-graph shape for any milestone that integrates an
        external provider (provider lanes, the repo-stored docs index, the
        doc-drift -> HUMAN issue contract). If a PR changes how tickets are
        labeled or scoped, how external-service milestones are constructed,
        triage behavior, the guidance text, which board changes are safe to
        auto-apply, or the agent-PR contract, confirm it stays consistent with
        these docs and with CLAUDE.md, and that no change is destructive by
        default (promise-bearing labels stay advisory). Flag a ticket called
        agent-ready that still leaves an open design decision to the agent, a
        consumer ticket missing a blocked-by edge to a not-yet-built contract,
        or an external-service milestone whose provider lanes or doc-drift
        handling diverge from the pattern.

chat:
  auto_reply: true
  integrations:
    linear:
      usage: "enabled"

knowledge_base:
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
