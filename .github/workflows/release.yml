name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from VERSION to release (e.g. 0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build and validate without creating the git tag"
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test, and publish tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: |
          UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen --group dev --extra pr-autopilot
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate release inputs
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python - <<'PY' "$VERSION"
          import re
          import sys

          version = sys.argv[1]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"VERSION must be SemVer MAJOR.MINOR.PATCH, got {version!r}")
          PY

          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED_TAG="$REF_NAME"
          else
            if [ "$DISPATCH_VERSION" != "$VERSION" ]; then
              echo "workflow_dispatch version '$DISPATCH_VERSION' does not match VERSION '$VERSION'" >&2
              exit 1
            fi
            EXPECTED_TAG="v$VERSION"
          fi

          if [ "$EXPECTED_TAG" != "v$VERSION" ]; then
            echo "Release tag '$EXPECTED_TAG' must match VERSION '$VERSION'" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$EXPECTED_TAG" >/dev/null && [ "$EVENT_NAME" != "push" ]; then
            echo "Tag '$EXPECTED_TAG' already exists; tags are immutable" >&2
            exit 1
          fi

          if [ ! -f CHANGELOG.md ] || ! grep -Fq "## $VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md must include a '## $VERSION' section before release" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN:-true}" >> "$GITHUB_OUTPUT"

      - name: Run local CI gate
        env:
          LINEAR_API_KEY: ""
        run: bin/ci-local --fast

      - name: Build wheel and sdist
        run: uv build

      - name: Inspect built package metadata
        run: |
          uv run python - <<'PY' "${{ steps.release.outputs.version }}"
          import sys
          import zipfile
          from pathlib import Path

          expected = sys.argv[1]
          wheel = next(Path("dist").glob("vibe-*.whl"))
          sdist = next(Path("dist").glob("vibe-*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = archive.read(metadata_name).decode()
          if f"Name: vibe\n" not in metadata:
              raise SystemExit("wheel metadata does not declare Name: vibe")
          if f"Version: {expected}\n" not in metadata:
              raise SystemExit(f"wheel metadata does not declare Version: {expected}")
          print(f"Built {wheel} and {sdist}")
          PY

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vibe-${{ steps.release.outputs.version }}-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Dry-run publish
        if: github.event_name == 'push' || steps.release.outputs.dry_run == 'true'
        run: |
          echo "Publish target: private git tag '${{ steps.release.outputs.tag }}'."
          echo "Wheel and sdist were built and uploaded for inspection; no package index upload is configured."

      - name: Publish immutable git tag
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.dry_run != 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release vibe $VERSION"
          git push origin "$TAG_NAME"
