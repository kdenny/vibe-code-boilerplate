name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-and-test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # This job only diffs and tests — it never pushes — so don't persist
          # the token into .git/config (closes the artipacked exposure).
          persist-credentials: false
          # Full history so PR runs can diff against the base commit to scope
          # which module tests to run (see "Select pytest scope" below).
          fetch-depth: 0

      - name: Detect test framework
        id: detect
        run: |
          # Detect Python tests
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ]; then
            if grep -q "pytest" pyproject.toml 2>/dev/null || \
               grep -q "pytest" requirements.txt 2>/dev/null || \
               { [ -d "tests" ] && ls tests/*.py >/dev/null 2>&1; }; then
              echo "has_pytest=true" >> $GITHUB_OUTPUT
              echo "Detected: pytest"
            fi
          fi

          # Detect Node.js tests
          if [ -f "package.json" ]; then
            if grep -q '"vitest"' package.json; then
              echo "has_vitest=true" >> $GITHUB_OUTPUT
              echo "Detected: vitest"
            fi
            if grep -q '"jest"' package.json; then
              echo "has_jest=true" >> $GITHUB_OUTPUT
              echo "Detected: jest"
            fi
            if grep -q '"test"' package.json; then
              echo "has_npm_test=true" >> $GITHUB_OUTPUT
              echo "Detected: npm test script"
            fi
          fi

          # Detect Playwright
          if [ -f "playwright.config.ts" ] || [ -f "playwright.config.js" ]; then
            echo "has_playwright=true" >> $GITHUB_OUTPUT
            echo "Detected: playwright"
          fi

          # Detect package manager
          if [ -f "pnpm-lock.yaml" ]; then
            echo "node_pm=pnpm" >> $GITHUB_OUTPUT
            echo "Package manager: pnpm"
          elif [ -f "yarn.lock" ]; then
            echo "node_pm=yarn" >> $GITHUB_OUTPUT
            echo "Package manager: yarn"
          else
            echo "node_pm=npm" >> $GITHUB_OUTPUT
            echo "Package manager: npm"
          fi

          # Detect lockfile presence (for install strategy)
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ] || [ -f "pnpm-lock.yaml" ]; then
            echo "has_lockfile=true" >> $GITHUB_OUTPUT
          fi

      # Python tests with pytest
      - name: Set up Python
        if: steps.detect.outputs.has_pytest == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Fast, cached installs (VIBE-85/185). When uv.lock is present, sync the
      # project with uv and cache uv's global download cache keyed on the lock
      # hash — cache key = hash(uv.lock) (setup-uv also keys on runner OS + uv
      # version). uv is markedly faster than pip cold and near-instant warm.
      # Projects without a uv lock fall through to the pip path.
      # Third-party action pinned to a commit SHA (supply-chain: a mutable tag
      # could be repointed). The SHA below is the commit v6 resolves to; bump it
      # and the trailing comment together when upgrading.
      - name: Set up uv
        if: steps.detect.outputs.has_pytest == 'true' && hashFiles('uv.lock') != ''
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        id: setup_uv
        continue-on-error: true
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies (uv, frozen)
        if: steps.detect.outputs.has_pytest == 'true' && hashFiles('uv.lock') != '' && steps.setup_uv.outcome == 'success'
        id: uv_install
        continue-on-error: true
        run: |
          # Sync into a project-local venv from uv.lock. Adding the venv to PATH
          # keeps later pytest invocations identical to local `bin/ci-local`.
          UV_PROJECT_ENVIRONMENT=.venv uv sync --frozen --group dev --extra pr-autopilot
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies (pip, fallback lock)
        # uv unavailable or its install failed: install the SAME pinned,
        # hash-locked closure generated from uv's dependency graph.
        if: steps.detect.outputs.has_pytest == 'true' && hashFiles('requirements.lock') != '' && steps.uv_install.outcome != 'success'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Install Python dependencies (pip, no lock)
        if: steps.detect.outputs.has_pytest == 'true' && hashFiles('uv.lock') == '' && hashFiles('requirements.lock') == ''
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov ruff mypy pyyaml

      # Module-scoped CI (vibe/testscope.py): on a pull request, run only the
      # tests for the modules that changed; run the FULL suite on main (the
      # safety net) and whenever a shared/core file changes. Keeps the agent
      # loop fast (speed rule) without losing coverage before release.
      - name: Select pytest scope
        id: scope
        if: steps.detect.outputs.has_pytest == 'true'
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event '${{ github.event_name }}' -> full suite."
            echo "targets=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $BASE...$HEAD"
          # Three-dot: changes on this branch since the merge base, so files
          # touched only on main (behind-main PRs) don't spuriously force ALL.
          CHANGED="$(git diff --name-only "$BASE...$HEAD")"
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'
          TARGETS="$(printf '%s\n' "$CHANGED" | PYTHONPATH=. python -m vibe.testscope)"
          echo "Selected pytest scope: ${TARGETS:-<none affected>}"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Run pytest
        if: steps.detect.outputs.has_pytest == 'true' && steps.scope.outputs.targets != ''
        env:
          # Consume the selector output as data via env, not inlined ${{ }}
          # script text: testscope derives targets from PR-changed filenames, so
          # a crafted name could otherwise inject shell here. As $TARGETS the
          # value is expanded after metacharacter parsing — word-splitting on
          # spaces still passes the paths, but ;/&/$() stay inert.
          TARGETS: ${{ steps.scope.outputs.targets }}
        run: |
          if [ "$TARGETS" = "ALL" ]; then
            pytest --cov --cov-report=xml --cov-report=term
          else
            pytest $TARGETS --cov --cov-report=xml --cov-report=term
          fi

      - name: No affected Python tests
        if: steps.detect.outputs.has_pytest == 'true' && steps.scope.outputs.targets == ''
        run: |
          echo "No changed files map to a Python test suite — skipping pytest."
          echo "The full suite still runs on pushes to main."

      - name: Build Python package
        if: steps.detect.outputs.has_pytest == 'true' && hashFiles('uv.lock') != '' && steps.uv_install.outcome == 'success'
        run: uv build

      # Node.js tests
      - name: Set up Node.js
        if: steps.detect.outputs.has_vitest == 'true' || steps.detect.outputs.has_jest == 'true' || steps.detect.outputs.has_npm_test == 'true' || steps.detect.outputs.has_playwright == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: ${{ steps.detect.outputs.has_lockfile == 'true' && steps.detect.outputs.node_pm || '' }}

      - name: Install Node dependencies
        if: steps.detect.outputs.has_vitest == 'true' || steps.detect.outputs.has_jest == 'true' || steps.detect.outputs.has_npm_test == 'true' || steps.detect.outputs.has_playwright == 'true'
        run: |
          PM="${{ steps.detect.outputs.node_pm }}"
          HAS_LOCK="${{ steps.detect.outputs.has_lockfile }}"
          if [ "$PM" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ "$PM" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            if [ "$HAS_LOCK" = "true" ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Run vitest
        if: steps.detect.outputs.has_vitest == 'true'
        run: npm run test -- --coverage

      - name: Run jest
        if: steps.detect.outputs.has_jest == 'true'
        run: npm test -- --coverage

      - name: Run npm test
        if: steps.detect.outputs.has_npm_test == 'true' && steps.detect.outputs.has_vitest != 'true' && steps.detect.outputs.has_jest != 'true'
        run: npm test

      # Playwright tests
      - name: Install Playwright
        if: steps.detect.outputs.has_playwright == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.detect.outputs.has_playwright == 'true'
        run: npx playwright test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            htmlcov/
            coverage.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: No tests found
        if: steps.detect.outputs.has_pytest != 'true' && steps.detect.outputs.has_vitest != 'true' && steps.detect.outputs.has_jest != 'true' && steps.detect.outputs.has_npm_test != 'true' && steps.detect.outputs.has_playwright != 'true'
        run: |
          echo "No test framework detected."
          echo "Supported frameworks: pytest, vitest, jest, playwright"
          echo "Add tests to enable automatic testing."
