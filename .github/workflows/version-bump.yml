name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump to apply when version is omitted"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version to write (optional, e.g. 0.1.0)"
        required: false
        type: string

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        env:
          BUMP_TYPE: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(cat VERSION)
          if [ -n "$EXACT_VERSION" ]; then
            NEW="$EXACT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            if [ "$BUMP_TYPE" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP_TYPE" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEW="$MAJOR.$MINOR.$PATCH"
          fi
          python - <<'PY' "$NEW"
          import re
          import sys

          version = sys.argv[1]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"Invalid version: {version}")
          PY
          echo "$NEW" > VERSION
          echo "Bumped $CURRENT -> $NEW"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to $(cat VERSION) [skip ci]"
          git push
